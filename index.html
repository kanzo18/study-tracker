<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streak Master - 学習の継続をサポート</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1a1a1a;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 40px 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.9) 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding: 0 5px;
        }

        .tab-btn {
            padding: 14px 28px;
            border: none;
            background: rgba(255,255,255,0.8);
            color: #667eea;
            cursor: pointer;
            border-radius: 12px;
            white-space: nowrap;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 15px;
            backdrop-filter: blur(5px);
            border: 2px solid transparent;
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.95);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.show {
            display: block;
        }

        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.9) 100%);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            border: none;
            box-shadow: 0 15px 45px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            color: #333;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .condition-buttons {
            display: flex;
            gap: 10px;
        }

        .condition-btn {
            flex: 1;
            padding: 12px;
            background-color: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .condition-btn.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .message {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-left: 4px solid #667eea;
            color: #667eea;
            font-weight: 600;
        }

        .message.show {
            display: block;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-nav button {
            padding: 10px 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.8) 100%);
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #667eea;
            transition: all 0.3s;
        }

        .calendar-nav button:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .weekday {
            text-align: center;
            font-weight: 600;
            color: #7ea8a8;
            font-size: 12px;
            padding: 8px 0;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            border: 1px solid #e8e6e1;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .day.has-record {
            background-color: #7ea8a8;
            color: #fff;
        }

        .day.other {
            background-color: #f0ede9;
            color: #bbb;
            cursor: default;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.3);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #fafafa;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }

        .modal-close {
            float: right;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-card {
            background-color: #f0ede9;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #7ea8a8;
        }

        .badges {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        .badge {
            padding: 15px;
            background-color: #fff;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-align: center;
        }

        .badge.locked {
            opacity: 0.5;
            filter: grayscale(100%);
        }

        .badge-icon {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .badge-name {
            font-size: 11px;
            font-weight: 600;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 学習継続トラッカー</h1>
            <p>毎日の学習を記録して、継続力を育てよう</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(0)">今日の記録</button>
            <button class="tab-btn" onclick="switchTab(1)">カレンダー</button>
            <button class="tab-btn" onclick="switchTab(2)">統計</button>
        </div>

        <!-- タブ1 -->
        <div class="tab-content show">
            <div id="message" class="message"></div>
            
            <div class="card">
                <h2>🎯 今日の目標</h2>
                <div class="form-group">
                    <label>目標問題数</label>
                    <input type="number" id="goalQ" min="0" placeholder="例: 10">
                </div>
                <div class="form-group">
                    <label>目標時間（分）</label>
                    <input type="number" id="goalM" min="0" placeholder="例: 60">
                </div>
                <button class="btn" onclick="saveGoals()">保存</button>
            </div>

            <div class="card">
                <h2>📝 今日の記録</h2>
                <div class="form-group">
                    <label>解いた問題数</label>
                    <input type="number" id="q" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>学習時間（分）</label>
                    <input type="number" id="m" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>コンディション</label>
                    <div class="condition-buttons">
                        <button class="condition-btn" onclick="setCondition(1)">😢 1</button>
                        <button class="condition-btn" onclick="setCondition(2)">😐 2</button>
                        <button class="condition-btn" onclick="setCondition(3)">😊 3</button>
                        <button class="condition-btn" onclick="setCondition(4)">😄 4</button>
                        <button class="condition-btn" onclick="setCondition(5)">🤩 5</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>メモ</label>
                    <textarea id="memo" placeholder="任意"></textarea>
                </div>
                <button class="btn" onclick="saveRecord()">記録する</button>
            </div>
        </div>

        <!-- タブ2 -->
        <div class="tab-content">
            <div class="card">
                <div class="calendar-header">
                    <h2>📅 カレンダー</h2>
                    <div>
                        <button class="calendar-nav" onclick="prevMonth()">← 前月</button>
                        <button class="calendar-nav" onclick="nextMonth()">次月 →</button>
                    </div>
                </div>
                <div id="monthYear" style="text-align: center; font-weight: 600; margin-bottom: 20px;"></div>
                <div class="weekdays">
                    <div class="weekday">日</div>
                    <div class="weekday">月</div>
                    <div class="weekday">火</div>
                    <div class="weekday">水</div>
                    <div class="weekday">木</div>
                    <div class="weekday">金</div>
                    <div class="weekday">土</div>
                </div>
                <div id="calGrid" class="days-grid"></div>
            </div>
        </div>

        <!-- タブ3 -->
        <div class="tab-content">
            <div class="card">
                <h2>📈 ストリーク</h2>
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 48px; color: #7ea8a8;" id="streak">0</div>
                    <div style="font-size: 14px; color: #666;" id="streakText">日連続</div>
                </div>
            </div>

            <div class="card">
                <h2>📊 統計</h2>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-label">累計問題数</div>
                        <div class="stat-value" id="totalQ">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">累計時間</div>
                        <div class="stat-value" id="totalM">0</div>
                        <div style="font-size: 12px; color: #666;">時間</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">今月記録日数</div>
                        <div class="stat-value" id="monthDays">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">平均コンディション</div>
                        <div class="stat-value" id="avgCond">-</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>🏆 バッジ</h2>
                <div class="badges" id="badges"></div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h3 id="modalDate"></h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let currentCondition = null;
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        function switchTab(n) {
            const tabs = document.querySelectorAll('.tab-content');
            const btns = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('show'));
            btns.forEach(b => b.classList.remove('active'));
            tabs[n].classList.add('show');
            btns[n].classList.add('active');
            
            if (n === 1) renderCalendar();
            if (n === 2) updateStats();
        }

        function getTodayStr() {
            const d = new Date();
            return d.toISOString().split('T')[0];
        }

        function showMsg(text) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        function setCondition(n) {
            currentCondition = n;
            document.querySelectorAll('.condition-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function saveGoals() {
            const q = parseInt(document.getElementById('goalQ').value) || 0;
            const m = parseInt(document.getElementById('goalM').value) || 0;
            localStorage.setItem('goals', JSON.stringify({q, m}));
            showMsg('✓ 目標を保存しました');
        }

        function loadGoals() {
            const g = JSON.parse(localStorage.getItem('goals')) || {q: 0, m: 0};
            document.getElementById('goalQ').value = g.q;
            document.getElementById('goalM').value = g.m;
        }

        function saveRecord() {
            const q = parseInt(document.getElementById('q').value) || 0;
            const m = parseInt(document.getElementById('m').value) || 0;
            const memo = document.getElementById('memo').value;
            
            if (q === 0 && m === 0) {
                showMsg('✗ 数値を入力してください');
                return;
            }
            if (currentCondition === null) {
                showMsg('✗ コンディションを選択してください');
                return;
            }
            
            const record = {q, m, condition: currentCondition, memo, time: new Date().toISOString()};
            localStorage.setItem('record_' + getTodayStr(), JSON.stringify(record));
            showMsg('✓ 記録しました！');
            
            document.getElementById('q').value = '';
            document.getElementById('m').value = '';
            document.getElementById('memo').value = '';
            currentCondition = null;
            document.querySelectorAll('.condition-btn').forEach(b => b.classList.remove('selected'));
            
            renderCalendar();
            updateStats();
        }

        function renderCalendar() {
            const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            document.getElementById('monthYear').textContent = `${currentYear}年 ${monthNames[currentMonth]}`;
            
            const first = new Date(currentYear, currentMonth, 1);
            const last = new Date(currentYear, currentMonth + 1, 0);
            const daysInMonth = last.getDate();
            const startDay = first.getDay();
            
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < startDay; i++) {
                const div = document.createElement('div');
                div.className = 'day other';
                grid.appendChild(div);
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const div = document.createElement('div');
                div.className = 'day';
                div.textContent = day;
                
                const dateStr = currentYear + '-' + String(currentMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
                const recStr = localStorage.getItem('record_' + dateStr);
                
                if (recStr) {
                    const rec = JSON.parse(recStr);
                    div.classList.add('has-record');
                    div.onclick = () => showModal(dateStr, rec);
                }
                
                grid.appendChild(div);
            }
            
            const remaining = 42 - grid.children.length;
            for (let i = 1; i <= remaining; i++) {
                const div = document.createElement('div');
                div.className = 'day other';
                grid.appendChild(div);
            }
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        }

        function showModal(dateStr, record) {
            const [y, m, d] = dateStr.split('-');
            const date = new Date(y, m-1, d);
            const dayName = ['日','月','火','水','木','金','土'][date.getDay()];
            document.getElementById('modalDate').textContent = `${y}年${m}月${d}日（${dayName}）`;
            document.getElementById('modalBody').innerHTML = `
                <p><strong>問題数：</strong>${record.q}問</p>
                <p><strong>時間：</strong>${record.m}分</p>
                <p><strong>コンディション：</strong>${['','😢','😐','😊','😄','🤩'][record.condition]} ${record.condition}/5</p>
                ${record.memo ? `<p><strong>メモ：</strong>${record.memo}</p>` : ''}
            `;
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function updateStats() {
            let totalQ = 0, totalM = 0, monthDays = 0, totalCond = 0, count = 0;
            const now = new Date();
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('record_')) {
                    const rec = JSON.parse(localStorage.getItem(key));
                    totalQ += rec.q;
                    totalM += rec.m;
                    totalCond += rec.condition;
                    count++;
                    
                    const [y, m] = key.substring(7).split('-');
                    if (parseInt(y) === now.getFullYear() && parseInt(m) === now.getMonth() + 1) {
                        monthDays++;
                    }
                }
            }
            
            document.getElementById('totalQ').textContent = totalQ;
            document.getElementById('totalM').textContent = (totalM / 60).toFixed(1);
            document.getElementById('monthDays').textContent = monthDays;
            document.getElementById('avgCond').textContent = count > 0 ? (totalCond / count).toFixed(1) : '-';
            
            updateStreak();
            updateBadges(totalQ, totalM);
        }

        function updateStreak() {
            let streak = 0;
            let d = new Date();
            d.setHours(0,0,0,0);
            
            while (true) {
                const dateStr = d.toISOString().split('T')[0];
                if (localStorage.getItem('record_' + dateStr)) {
                    streak++;
                    d.setDate(d.getDate() - 1);
                } else {
                    break;
                }
            }
            
            document.getElementById('streak').textContent = streak;
            document.getElementById('streakText').textContent = streak > 0 ? `${streak}日連続！` : 'まだ記録なし';
        }

        function updateBadges(totalQ, totalM) {
            const badges = [
                {icon: '🎯', name: '初記録', check: totalQ > 0},
                {icon: '🔥', name: '7日連続', check: parseInt(document.getElementById('streak').textContent) >= 7},
                {icon: '⭐', name: '30日連続', check: parseInt(document.getElementById('streak').textContent) >= 30},
                {icon: '💯', name: '100問', check: totalQ >= 100},
                {icon: '⏰', name: '10時間', check: (totalM / 60) >= 10}
            ];
            
            const html = badges.map(b => `
                <div class="badge ${b.check ? '' : 'locked'}">
                    <div class="badge-icon">${b.icon}</div>
                    <div class="badge-name">${b.name}</div>
                </div>
            `).join('');
            
            document.getElementById('badges').innerHTML = html;
        }

        window.onload = () => {
            loadGoals();
            renderCalendar();
            updateStats();
        };
    </script>
</body>
</html>
